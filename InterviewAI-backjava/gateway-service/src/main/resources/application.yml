server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 290s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: interview-service-start
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/interviews/start

            - id: interview-service-answer
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/interviews/answer

            - id: interview-service-voice-answer
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/interviews/answer/voice

            - id: interview-service-other
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/interviews/**

            - id: report-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/reports/**

            - id: assessment-service-hr
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/assessments/**,/api/v1/assessment-attempts/**

            - id: assessment-service-public
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/public/assessments/**,/api/v1/public/assessment-attempts/**,/api/v1/public/assessment-results/**

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "change-this-secret-key-to-at-least-32-bytes"

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
  security:
    jwt:
      secret: "secret Oleg-Olegovich key for you 58"